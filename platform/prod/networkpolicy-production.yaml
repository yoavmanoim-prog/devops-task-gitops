# Alone on its own cluster, so this isn't load-bearing for isolation the way
# dev/staging's copy is - kept anyway as a defense-in-depth baseline, and for
# parity across environments. Same enforcement caveat as
# platform/dev/networkpolicy-dev.yaml: the VPC CNI ships NetworkPolicy support
# off, so until it is enabled this object is accepted and ignored.
#
# ipBlock is the prod VPC's PUBLIC subnet range (10.1.32.0/20 + 10.1.48.0/20
# = 10.1.32.0/19), where the internet-facing ALB's ENIs live. Needed because
# target-type: ip means the ALB connects directly to pod IPs and so is not
# matched by podSelector. NOT the whole VPC CIDR - pods hold private-subnet
# addresses, so 10.1.0.0/16 would allow every pod on the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-other-namespaces
  namespace: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # pods in this namespace
        - podSelector: {}
        # the internet-facing ALB's ENIs - public subnets only
        - ipBlock:
            cidr: 10.1.32.0/19
