# Alone on its own cluster, so this isn't load-bearing for isolation the way
# dev/staging's copy is - kept anyway as defense-in-depth baseline, and for
# parity across environments. Same enforcement caveat as
# platform/dev/networkpolicy-dev.yaml applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-other-namespaces
  namespace: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
