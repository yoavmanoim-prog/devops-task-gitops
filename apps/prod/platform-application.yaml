apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod-cluster
  namespace: argocd
spec:
  project: prod
  source:
    repoURL: https://github.com/yoavmanoim-prog/devops-task-gitops.git
    targetRevision: HEAD
    path: platform/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
