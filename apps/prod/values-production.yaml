# PLACEHOLDER image - see apps/dev/values-dev.yaml's comment. Production's
# tag is promoted from staging by a human PR (reads staging's current tag,
# writes it here); the manual-sync Application above is the actual
# deployment gate, this file landing is not the same as it going live.
image:
  repository: 302954730632.dkr.ecr.us-east-1.amazonaws.com/devops-task-app
  tag: "sha-ad319c5"

# NOTE: no replicaCount here on purpose. autoscaling.enabled below means the
# chart's deployment template omits `replicas` entirely and the HPA owns it -
# so a replicaCount line would be inert config that still *reads* like it sets
# the replica count. minReplicas is the real floor.

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  host: app.devops-task.internal # placeholder - no real DNS/ACM wired up, see README
  annotations:
    # opt-in override of the chart's internal-by-default scheme - see
    # apps/dev/values-dev.yaml's comment
    alb.ingress.kubernetes.io/scheme: internet-facing

env:
  - name: APP_ENV
    value: production

configMap:
  enabled: true
  data:
    APP_TIER: production

externalSecret:
  enabled: true
  target:
    name: app-secret
  remoteRef:
    key: devops-task/production/app-secret
